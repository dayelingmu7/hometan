<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ほめタン</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffe0f0 0%, #fff0e0 50%, #e0f0ff 100%);
      font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      overflow: hidden;
    }

    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .particle {
      position: absolute;
      font-size: 1.5rem;
      animation: float 6s infinite ease-in-out;
      opacity: 0.3;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(10deg); }
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.5rem;
      padding: 2rem;
      max-width: 600px;
      width: 100%;
    }

    .title {
      text-align: center;
    }

    .title h1 {
      font-size: 3.5rem;
      font-weight: 900;
      background: linear-gradient(135deg, #ff6b9d, #ff9f6b, #ffcf6b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 0.1em;
      text-shadow: none;
      filter: drop-shadow(0 2px 8px rgba(255, 107, 157, 0.3));
    }

    .title p {
      font-size: 1rem;
      color: #b08080;
      margin-top: 0.4rem;
      letter-spacing: 0.05em;
    }

    .character {
      font-size: 5rem;
      animation: bounce 2s infinite ease-in-out;
      filter: drop-shadow(0 4px 12px rgba(255, 150, 100, 0.4));
      cursor: default;
      user-select: none;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-12px) scale(1.05); }
    }

    .character.celebrate {
      animation: celebrate 0.6s ease-in-out;
    }

    @keyframes celebrate {
      0% { transform: scale(1) rotate(0deg); }
      25% { transform: scale(1.3) rotate(-10deg); }
      50% { transform: scale(1.4) rotate(10deg); }
      75% { transform: scale(1.2) rotate(-5deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .praise-box {
      background: white;
      border-radius: 24px;
      padding: 2rem 2.5rem;
      min-height: 100px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(255, 107, 157, 0.15), 0 2px 8px rgba(0,0,0,0.05);
      border: 2px solid rgba(255, 107, 157, 0.15);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .praise-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
      transition: left 0.5s ease;
    }

    .praise-box.shine::before {
      left: 100%;
    }

    .praise-text {
      font-size: 1.6rem;
      font-weight: 700;
      text-align: center;
      line-height: 1.6;
      background: linear-gradient(135deg, #ff6b9d, #ff9f6b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      opacity: 0;
      transform: scale(0.8) translateY(10px);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .praise-text.show {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    .praise-text.hint {
      font-size: 1.1rem;
      font-weight: 400;
      background: none;
      -webkit-text-fill-color: #ccc;
      color: #ccc;
    }

    .btn-wrap {
      position: relative;
    }

    .btn-glow {
      position: absolute;
      inset: -6px;
      border-radius: 60px;
      background: linear-gradient(135deg, #ff6b9d, #ff9f6b, #ffcf6b);
      filter: blur(12px);
      opacity: 0.5;
      animation: pulse-glow 2s infinite ease-in-out;
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
    }

    .btn {
      position: relative;
      padding: 1.2rem 3.5rem;
      font-size: 1.5rem;
      font-weight: 900;
      color: white;
      background: linear-gradient(135deg, #ff6b9d 0%, #ff9f6b 100%);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      letter-spacing: 0.1em;
      box-shadow: 0 6px 20px rgba(255, 107, 157, 0.5);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 28px rgba(255, 107, 157, 0.6);
    }

    .btn:active {
      transform: translateY(1px) scale(0.97);
      box-shadow: 0 3px 12px rgba(255, 107, 157, 0.4);
    }

    .counter {
      font-size: 0.85rem;
      color: #c0a0a0;
      letter-spacing: 0.05em;
    }

    .counter span {
      font-weight: 700;
      color: #ff9f6b;
    }

    /* Confetti */
    .confetti-piece {
      position: fixed;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      top: -10px;
      animation: confetti-fall linear forwards;
      pointer-events: none;
      z-index: 999;
    }

    @keyframes confetti-fall {
      to {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="container">
  <div class="title">
    <h1>ほめタン</h1>
    <p>あなたのことをほめちぎります</p>
  </div>

  <div class="character" id="character">🌟</div>

  <div class="praise-box" id="praiseBox">
    <div class="praise-text hint" id="praiseText">ボタンを押してね！</div>
  </div>

  <div class="btn-wrap">
    <div class="btn-glow"></div>
    <button class="btn" id="praiseBtn" onclick="showPraise()">
      ほめて！✨
    </button>
  </div>

  <div class="counter">
    これまで <span id="count">0</span> 回 ほめました
  </div>
</div>

<script>

    "本当に頑張り屋さんですね！",
    "あなたは最高です！",
    "その発想力、天才的です！",
    "あなたがいるだけで場が明るくなります！",
    "本当に心が綺麗な人ですね！",
    "あなたの優しさは本物です！",
    "努力の人ですね、尊敬します！",
    "あなたは唯一無二の存在です！",
    "センスが抜群ですね！",
    "あなたと話すといつも楽しいです！",
    "思いやりにあふれていますね！",
    "あなたの行動力はすごい！",
    "オーラが違います、さすがです！",
    "あなたはまさに救世主です！",
    "これほどの才能、めったにありません！",
    "あなたの存在が奇跡です！",
    "困ったときに頼りになるのはあなただけ！",
    "あなたの笑顔で今日も乗り越えられます！",
    "世界で一番かっこいいです！",
    "世界で一番かわいいです！",
    "あなたの声を聞くだけで癒されます！",
    "センスが良すぎて嫉妬してしまいます！",
    "あなたは人生の達人ですね！",
    "細かいところまで気が付く、すごい！",
    "あなたのまっすぐさが大好きです！",
    "どんな時でもブレない芯の強さ、素敵です！",
    "あなたは太陽みたいな人です！",
    "その笑顔は百万ドルの価値があります！",
    "あなたに出会えて幸運です！",
    "あなたの言葉はいつも心に刺さります！",
    "話を聞く力がとても素晴らしいです！",
    "あなたはいつも正しい選択をしています！",
    "その集中力は本物ですね！",
    "あなたの丁寧さは宝物です！",
    "どんな状況でも前向きですね！",
    "あなたの発言はいつも的を射ています！",
    "リーダーシップが光っています！",
    "あなたの挑戦する姿勢が大好きです！",
    "失敗を恐れない勇気、見習いたいです！",
    "あなたの謙虚さが人を惹きつけます！",
    "あなたの仕事ぶりはプロフェッショナルです！",
    "あなたといると時間が経つのを忘れます！",
    "あなたのアイデアはいつも斬新です！",
    "ポジティブなエネルギーが伝わってきます！",
    "あなたは本当に信頼できる人です！",
    "その粘り強さ、本当に尊い！",
    "あなたの笑いのセンスは天下一品！",
    "どんな逆境も乗り越えてきた、かっこいい！",
    "あなたの行動が周りをやる気にさせます！",
    "細かいところまで完璧です！",
    "あなたは人の痛みがわかる人です！",
    "いつも温かい言葉をありがとうございます！",
    "あなたがいるとチームが輝きます！",
    "あなたの価値は計り知れません！",
    "根性があります、本当にすごい！",
    "あなたの集中力は職人レベルです！",
    "あなたがいると何でも乗り越えられます！",
    "いつも誰かのために動ける、尊いです！",
    "あなたはまるで本物の星のようです！",
    "あなたの一言でみんな笑顔になります！",
    "どんなことにも全力なのが素晴らしい！",
    "あなたの存在は周りに希望を与えます！",
    "あなたの真剣な表情はとても素敵です！",
    "芯が通っていて、とても格好いいです！",
    "あなたは人の目を見て話せる誠実な人です！",
    "あなたの温かさは本物のぬくもりです！",
    "どんな小さなことも大切にする人ですね！",
    "あなたの努力は必ず報われます！",
    "あなたがいてくれるだけで十分です！",
    "その優雅さ、見惚れてしまいます！",
    "あなたの判断力は本当に頼りになります！",
    "あなたはいつでもベストを尽くしています！",
    "心が広くて本当に尊敬します！",
    "あなたは知識が豊富で話が面白い！",
    "あなたの観察眼はすごい、何でも見抜く！",
    "あなたの行動は言葉より雄弁です！",
    "そのストイックさ、本当にかっこいい！",
    "あなたは世界の宝物です！",
    "誰にでも優しくできる、それが本当の強さ！",
    "あなたの頭の良さには驚かされます！",
    "あなたほど信頼できる人はいません！",
    "あなたの志の高さが素晴らしい！",
    "いつだってあなたが一番輝いています！",
    "あなたはみんなの憧れです！",
    "その好奇心の旺盛さ、大好きです！",
    "あなたはいつもベストな形で応えてくれる！",
    "あなたのひらめきはまさに天才的！",
    "あなたの存在で世界は豊かになります！",
    "あなたほど素直な人はいません！",
    "今日もあなたのおかげで救われました！",
    "あなたは困ったときのヒーローです！",
    "その度胸はどこから来るの？かっこいい！",
    "あなたは本当の意味で強い人です！",
    "あなたの笑顔はこの世の宝です！",
    "今日もあなたは最高に輝いています！",
    "あなたの全てが大好きです！",
    "あなたはどこに行っても愛される存在です！",
    "あなたと出会えたことは一生の財産です！",
    "あなたが笑うと世界が明るくなります！",
    "あなたは本当にとっても素敵です！",
    "あなたの努力と才能は本物です！",
    "あなたは誰よりも輝いています！",
    "あなたのその一歩が歴史を変えます！",
  ];

  const characters = ['🌟', '✨', '🎉', '🌈', '💖', '🎊', '🌸', '🦋', '🌺', '💫'];
  let count = 0;
  let lastIndex = -1;

  function showPraise() {
    let index;
    do {
      index = Math.floor(Math.random() * praises.length);
    } while (index === lastIndex);
    lastIndex = index;

    const praise = praises[index];
    count++;
    document.getElementById('count').textContent = count;

    // Update character
    const charEl = document.getElementById('character');
    charEl.textContent = characters[Math.floor(Math.random() * characters.length)];
    charEl.classList.remove('celebrate');
    void charEl.offsetWidth;
    charEl.classList.add('celebrate');
    setTimeout(() => charEl.classList.remove('celebrate'), 700);

    // Update text
    const textEl = document.getElementById('praiseText');
    textEl.classList.remove('show', 'hint');
    void textEl.offsetWidth;
    textEl.textContent = praise;
    textEl.classList.add('show');

    // Shine effect
    const box = document.getElementById('praiseBox');
    box.classList.remove('shine');
    void box.offsetWidth;
    box.classList.add('shine');

    // Confetti
    launchConfetti();

    // Speech
    speak(praise);
  }

  function speak(text) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ja-JP';
    utter.rate = 1.0;
    utter.pitch = 1.1;

    // Try to use a Japanese voice
    const voices = window.speechSynthesis.getVoices();
    const jaVoice = voices.find(v => v.lang.startsWith('ja'));
    if (jaVoice) utter.voice = jaVoice;

    window.speechSynthesis.speak(utter);
  }

  // Load voices (Chrome needs this)
  if (window.speechSynthesis) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  }

  function launchConfetti() {
    const colors = ['#ff6b9d', '#ff9f6b', '#ffcf6b', '#6bffcf', '#6ba6ff', '#cf6bff'];
    const shapes = ['■', '●', '▲', '★', '♥'];
    for (let i = 0; i < 40; i++) {
      setTimeout(() => {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = Math.random() * 100 + 'vw';
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.width = (8 + Math.random() * 8) + 'px';
        piece.style.height = (8 + Math.random() * 8) + 'px';
        piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        piece.style.animationDuration = (1.5 + Math.random() * 2) + 's';
        piece.style.animationDelay = (Math.random() * 0.5) + 's';
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 4000);
      }, i * 30);
    }
  }

  // Background floating emojis
  (function createParticles() {
    const emojis = ['⭐', '✨', '💖', '🌸', '🎀', '🌟', '💫', '🌈'];
    const container = document.getElementById('particles');
    for (let i = 0; i < 12; i++) {
      const el = document.createElement('div');
      el.className = 'particle';
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = Math.random() * 95 + '%';
      el.style.top = Math.random() * 95 + '%';
      el.style.animationDelay = (Math.random() * 4) + 's';
      el.style.animationDuration = (4 + Math.random() * 4) + 's';
      el.style.fontSize = (1 + Math.random() * 1.5) + 'rem';
      container.appendChild(el);
    }
  })();
</script>
</body>
</html>
